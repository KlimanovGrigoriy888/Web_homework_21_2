<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div class="container-fluid">
    <div class="row justify-content-center"> <!-- Основной блок для работы с колонками -->
        <div class="col-2 text-bg-dark p-3" style="min-height: 100vh;">
            <nav class="navbar bg-body-tertiary" data-bs-theme="dark">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">
                        <img src="/docs/5.3/assets/brand/bootstrap-logo.svg" alt="Logo" width="30" height="24"
                             class="d-inline-block align-text-top">
                        Меню
                    </a>
                </div>
            </nav>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link text-white" href="index.html">Главная</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="categories.html">Категории</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="orders.html">Заказы</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="contacts.html">Контакты</a>
                </li>
            </ul>
        </div>
        <div class="col-10"> <!-- Колонка шириной 10/12 для размещения основного контента -->
            <div class="row mt-5">
                <figure class="text-center"> <!-- Поле раздела "Каталог" шириной 10/12-->
                    <blockquote class="blockquote">
                        <h1>Контакты</h1>
                    </blockquote>
                    <p><small class="text-muted"></small></p>
                </figure>
            </div>
            <div class="row mt-5 justify-content-center"> <!-- Дополнительный вложенный блок для работы с колонками -->
                <div class="col-4"> <!-- -->
                    <div class="col-md-8">
                        <div class="card shadow-">
                            <div class="card-body p-6">
                                <form method="post"> <!-- без action="/" -->
                                    <div class="mb-3">
                                        <label for="InputName" class="form-label">Имя</label>
                                        <input type="text" name="username" class="form-control" id="InputName"
                                               placeholder="">
                                    </div>
                                    <div class="mb-3">
                                        <label for="InputEmail" class="form-label">Почта</label>
                                        <input type="email" class="form-control" name="email" id="InputEmail"
                                               placeholder="email@example.com">
                                    </div>
                                    <div class="mb-3">
                                        <label for="InputTextarea1" class="form-label">Сообщение</label>
                                        <textarea class="form-control" id="InputTextarea1"
                                                  name="message" placeholder="Введите текст" rows="3"></textarea>
                                    </div>
                                    <button type="submit" class="btn btn-primary">Отправить</button>
                                </form>

                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-4">
                    <figure class="text-center">
                        <h4>Наши контакты</h4>
                        <p>Свяжитесь с нами любым удобным способом</p>
                    </figure>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
